<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistica</title>
    <link rel="stylesheet" href="logistica.css">
    <script src="logistica.js"defer></script>

</head>
<body>
    <div class="sidebar">
        <h2>Logística</h2>
        <a href="#" onclick="mostrarTela('motorista')">Cadastro Motorista</a>
        <a href="#" onclick="mostrarTela('caminhao')">Cadastro Caminhão</a>
        <a href="#" onclick="mostrarTela('registro')">Registrar Entrega</a>
        <a href="#" onclick="mostrarTela('pesquisa')">Pesquisar Entrega</a>
      </div>
      <div class="main">
        <!-- Cadastro Motorista -->
        <div id="motorista" class="tela">
          <h2>Cadastro de Motorista</h2>
          <div class="form-group"><label>Nome</label><input id="nomeMotorista"></div>
          <div class="form-group"><label>CPF</label><input id="cpfMotorista"></div>
          <div class="form-group"><label>CNH</label><input id="cnhMotorista"></div>
          <button onclick="cadastrarMotorista()">Cadastrar</button>
          <div id="listaMotoristas"></div>
        </div>
    
        <!-- Cadastro Caminhão -->
        <div id="caminhao" class="tela hidden">
          <h2>Cadastro de Caminhão</h2>
          <div class="form-group"><label>Placa</label><input id="placaCaminhao"></div>
          <div class="form-group"><label>Modelo</label><input id="modeloCaminhao"></div>
          <div class="form-group"><label>Ano</label><input id="anoCaminhao" type="number"></div>
          <div class="form-group"><label>Capacidade (kg)</label><input id="capacidadeCaminhao" type="number"></div>
          <button onclick="cadastrarCaminhao()">Cadastrar</button>
          <div id="listaCaminhoes"></div>
        </div>
    
        <!-- Registrar Entrega -->
        <div id="registro" class="tela hidden">
          <h2>Registrar Entrega</h2>
          <div class="form-group"><label>Motorista</label><select id="selectMotorista"></select></div>
          <div class="form-group"><label>Caminhão</label><select id="selectCaminhao"></select></div>
          <div class="form-group"><label>Separador</label><input id="nomeSeparador"></div>
          <div class="form-group"><label>Carregador</label><input id="nomeCarregador"></div>
          <div class="form-group"><label>Destino</label><input id="destinoEntrega"></div>
          <div class="form-group"><label>Produtos (Notas)</label><textarea id="produtosEntrega"></textarea></div>
          <button onclick="registrarEntrega()">Registrar</button>
        </div>
    
        <!-- Pesquisa -->
        <div id="pesquisa" class="tela hidden">
          <h2>Pesquisar Entrega</h2>
          <div class="form-group"><label>Caminhão</label><select id="selectPesquisa"></select></div>
          <button onclick="pesquisarEntrega()">Pesquisar</button>
          <div id="resultadoEntrega"></div>
          <button onclick="gerarPDF()">Gerar PDF</button>
        </div>
      </div>
    
</body>
</html>
